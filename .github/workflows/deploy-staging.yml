name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging-public-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Design authority validation
        run: npm run validate:design

      - name: Production build
        run: npm run build

      - name: SEO validation
        run: npm run validate:seo

  deploy:
    name: Deploy public site to staging
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR }}
    steps:
      - name: Check staging deployment configuration
        id: staging
        shell: bash
        run: |
          required=(
            STAGING_SSH_PRIVATE_KEY
            STAGING_SSH_KNOWN_HOSTS
            STAGING_SSH_HOST
            STAGING_SSH_PORT
            STAGING_SSH_USER
            STAGING_APP_DIR
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Staging deployment skipped: required repository secrets are not configured."
              exit 0
            fi
          done
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure staging SSH access
        if: steps.staging.outputs.configured == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build and replace staging public service
        if: steps.staging.outputs.configured == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$STAGING_SSH_PORT" "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "STAGING_APP_DIR='$STAGING_APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$STAGING_APP_DIR"

          # 1. Update source repositories
          if [ -d "src/backend/.git" ]; then
            git -C src/backend reset --hard HEAD
            git -C src/backend fetch --prune origin main
            git -C src/backend checkout -B main origin/main
          else
            git clone https://github.com/tahamohamadi-ir/TahaMohammadi-platform-backEnd.git src/backend
          fi

          if [ -d "src/admin/.git" ]; then
            git -C src/admin reset --hard HEAD
            git -C src/admin fetch --prune origin main
            git -C src/admin checkout -B main origin/main
          else
            git clone https://github.com/tahamohamadi-ir/TahaMohammadi-platform-FrontEnd-adminPanel.git src/admin
          fi

          git -C src/public reset --hard HEAD
          git -C src/public fetch --prune origin main
          git -C src/public checkout --detach "$DEPLOY_SHA"

          # 2. Update deploy configuration files
          mkdir -p deploy

          cat <<'EOF' > deploy/Dockerfile.admin
          FROM node:22-bookworm AS build
          WORKDIR /app
          COPY src/admin/package.json src/admin/package-lock.json ./
          RUN npm ci
          COPY src/admin/ ./
          RUN npm run build

          FROM nginx:1.27-alpine
          COPY deploy/nginx-admin.conf /etc/nginx/conf.d/default.conf
          COPY --from=build /app/dist/ /usr/share/nginx/html/admin/
          COPY --from=build /app/dist/ /usr/share/nginx/html/
          EOF

          cat <<'EOF' > deploy/nginx-admin.conf
          server {
            listen 8080;
            server_name _;

            location /admin/ {
              alias /usr/share/nginx/html/admin/;
              try_files $uri $uri/ /admin/index.html;
            }

            location / {
              root /usr/share/nginx/html;
              try_files $uri $uri/ /index.html;
            }
          }
          EOF

          cat <<'EOF' > deploy/docker-compose.stage.yml
          name: taha-cms-stage

          services:
            db:
              image: postgres:17-alpine
              restart: unless-stopped
              environment:
                POSTGRES_DB: ${POSTGRES_DB}
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              volumes:
                - stage_postgres_data:/var/lib/postgresql/data
              networks: [stage_internal]
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
                interval: 5s
                timeout: 5s
                retries: 20

            mailpit:
              image: axllent/mailpit:v1.27
              restart: unless-stopped
              networks: [stage_internal]

            cms:
              build:
                context: ..
                dockerfile: deploy/Dockerfile.cms
              image: taha-cms-stage:${RELEASE_ID}
              restart: unless-stopped
              env_file: [../.env.stage]
              environment:
                DJANGO_SETTINGS_MODULE: config.settings.production
                POSTGRES_HOST: db
                EMAIL_HOST: mailpit
                EMAIL_PORT: "1025"
                EMAIL_USE_TLS: "false"
                OTP_TOTP_ISSUER: tahamohamadi.ir
                REBUILD_TRIGGER_ENABLED: "false"
              volumes:
                - stage_cms_media:/app/media
              networks: [stage_internal, stage_ingress]
              depends_on:
                db:
                  condition: service_healthy

            web:
              build:
                context: ..
                dockerfile: deploy/Dockerfile.public
                args:
                  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://tahamohamadi.ir}
                  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://tahamohamadi.ir}
              image: taha-web-stage:${RELEASE_ID}
              restart: unless-stopped
              volumes:
                - stage_public_html:/usr/share/nginx/html
                - stage_edge_deny:/etc/nginx/conf.d
              networks: [stage_ingress]

            admin:
              build:
                context: ..
                dockerfile: deploy/Dockerfile.admin
              image: taha-admin-stage:${RELEASE_ID}
              restart: unless-stopped
              networks: [stage_ingress]

          networks:
            stage_internal:
              internal: true
            stage_ingress: {}

          volumes:
            stage_postgres_data: {}
            stage_public_html: {}
            stage_edge_deny: {}
            stage_cms_media:
              external: true
              name: taha-cms-stage_stage_cms_media
          EOF

          # 3. Update environment configuration in .env.stage
          next_release_id="prod-${DEPLOY_SHA:0:12}"

          if grep -q '^RELEASE_ID=' .env.stage; then
            sed -i "s/^RELEASE_ID=.*/RELEASE_ID=${next_release_id}/" .env.stage
          else
            echo "RELEASE_ID=${next_release_id}" >> .env.stage
          fi

          if grep -q '^ALLOWED_HOSTS=' .env.stage; then
            sed -i "s/^ALLOWED_HOSTS=.*/ALLOWED_HOSTS=tahamohamadi.ir,www.tahamohamadi.ir,staging.tahamohamadi.ir,localhost,127.0.0.1/" .env.stage
          else
            echo "ALLOWED_HOSTS=tahamohamadi.ir,www.tahamohamadi.ir,staging.tahamohamadi.ir,localhost,127.0.0.1" >> .env.stage
          fi

          if grep -q '^PUBLIC_SITE_URL=' .env.stage; then
            sed -i "s|^PUBLIC_SITE_URL=.*|PUBLIC_SITE_URL=https://tahamohamadi.ir|" .env.stage
          else
            echo "PUBLIC_SITE_URL=https://tahamohamadi.ir" >> .env.stage
          fi

          if grep -q '^PUBLIC_API_BASE_URL=' .env.stage; then
            sed -i "s|^PUBLIC_API_BASE_URL=.*|PUBLIC_API_BASE_URL=https://tahamohamadi.ir|" .env.stage
          else
            echo "PUBLIC_API_BASE_URL=https://tahamohamadi.ir" >> .env.stage
          fi

          # 4. Build all services
          docker compose --env-file .env.stage -f deploy/docker-compose.stage.yml build cms admin web

          # 5. Database migrations
          docker compose --env-file .env.stage -f deploy/docker-compose.stage.yml run --rm cms python manage.py migrate --noinput
          docker compose --env-file .env.stage -f deploy/docker-compose.stage.yml run --rm cms python manage.py import_content_seed || true

          # 6. Start/recreate all services
          docker compose --env-file .env.stage -f deploy/docker-compose.stage.yml up -d --force-recreate cms admin web

          # 7. Synchronize fresh static web build into the mounted volume
          web_cid=$(docker compose --env-file .env.stage -f deploy/docker-compose.stage.yml ps -q web)
          if [ -n "${web_cid}" ]; then
            temp_cid=$(docker create "taha-web-stage:${next_release_id}")
            rm -rf /tmp/web_dist_sync
            mkdir -p /tmp/web_dist_sync
            docker cp "${temp_cid}:/usr/share/nginx/html/." /tmp/web_dist_sync/
            docker rm "${temp_cid}"
            docker cp /tmp/web_dist_sync/. "${web_cid}:/usr/share/nginx/html/"
            rm -rf /tmp/web_dist_sync
            docker exec "${web_cid}" nginx -s reload
          fi

          # 8. Verify service health
          sleep 5
          test "$(docker compose --env-file .env.stage -f deploy/docker-compose.stage.yml ps --status running --services cms)" = cms
          test "$(docker compose --env-file .env.stage -f deploy/docker-compose.stage.yml ps --status running --services admin)" = admin
          test "$(docker compose --env-file .env.stage -f deploy/docker-compose.stage.yml ps --status running --services web)" = web
          REMOTE
