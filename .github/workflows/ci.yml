name: CI

on:
  push:
    branches: [main, 'cx/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, design, SEO, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: pipx run --spec detect-secrets==1.5.0 detect-secrets scan --baseline .secrets.baseline --exclude-files '\.secrets\.baseline$'

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Design authority validation
        run: npm run validate:design

      - name: Production build
        run: npm run build

      - name: SEO validation
        run: npm run validate:seo
