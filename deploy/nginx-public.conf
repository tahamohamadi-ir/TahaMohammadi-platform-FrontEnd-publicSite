# Matches Infra/staging/nginx-public.conf: the edge-deny manifest map lets
# the running container keep serving revoked/retired canonical paths as 404
# without rebuilding the image (the map files live in the prod_edge_deny
# volume mounted at /etc/nginx/conf.d, which this workflow never touches).
map $uri $edge_denied {
  default 0;
  include /etc/nginx/conf.d/edge-deny*.map;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($edge_denied) {
    return 404;
  }

  location / { try_files $uri $uri/ =404; }
}
